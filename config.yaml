# ===========================================================================
# AI-Business Radar — Konfiguration
# Secrets stehen NICHT hier, sondern in .env (siehe .env.example).
# ===========================================================================

profil:
  # Wird direkt in den Analyse- und Report-Prompt injiziert, damit Relevanz
  # an DIR ausgerichtet wird statt an "Business" im Allgemeinen.
  beschreibung: >
    Solo-Entwickler in der Schweiz mit technischem Hintergrund (TypeScript,
    SvelteKit), der praktische, umsetzbare Wege sucht, mit AI konkret Geld zu
    verdienen — von automatisierten Diensten und Micro-SaaS über E-Commerce-
    und Automatisierungs-Bots (inkl. Dropshipping) bis zu Nischen-Workflows und
    Nebeneinkommen. ENTSCHEIDEND ist harte Substanz: echte Zahlen (Umsatz,
    Kosten, Zeitaufwand, Conversion), gezeigte Implementierungen, nachvollziehbare
    Systeme, benannte Fehlschläge. Bevorzugt lokal-first und kleine, eigenständig
    baubare Lösungen für den DACH-Markt, aber grundsätzlich offen für jede
    erprobte Methode, solange sie belegt und nachbaubar ist.
    NICHT interessiert an: reinem Kursverkauf, Coaching-/Community-Werbung,
    unbelegten Einkommensbehauptungen, Motivations-/Hustle-Content und
    oberflächlichen "Top 10 AI Tools"-Aufzählungen ohne eigene Ergebnisse.

modelle:
  # Modell-IDs sind bewusst hier zentral – jederzeit austauschbar.
  # EMPFEHLUNG: analyse auf "claude-sonnet-5" (rund halbe Kosten pro Video bei
  # sehr ähnlicher Substanzbewertung); report/clustering auf Opus lassen.
  analyse: "claude-sonnet-5"          # ein Aufruf pro Video (günstig; für Opus: "claude-opus-4-8")
  report: "claude-opus-4-8"           # finale Synthese (stärkeres Modell)
  clustering: "claude-opus-4-8"       # Themen-Cluster + Wiederholungsabgleich
  # Preise pro 1M Tokens (USD) – für Kostentracking UND den Tagesdeckel.
  # WICHTIG: Jedes genutzte Modell muss hier stehen, sonst wird es mit $0
  # verbucht und der Kostendeckel greift nicht.
  preise:
    claude-opus-4-8:
      input_pro_1m: 5.00
      output_pro_1m: 25.00
    claude-sonnet-5:
      input_pro_1m: 3.00
      output_pro_1m: 15.00
    claude-haiku-4-5:
      input_pro_1m: 1.00
      output_pro_1m: 5.00

# ---------------------------------------------------------------------------
# Discovery-Quelle A: kuratiertes Kanal-Monitoring (Hauptquelle, quota-günstig)
# ---------------------------------------------------------------------------
# STARTER-LISTE – bitte anpassen. Du kannst Kanäle per Handle (@name),
# per channel_id (UC...) oder per URL angeben; die uploads-Playlist wird
# beim ersten Lauf automatisch aufgelöst und in der DB gecacht.
# vertrauens_score (0-10): fließt als leichtes Gewicht in die Priorisierung
# ein – für Kanäle, denen du inhaltlich mehr traust, höher setzen.
# tier: A → vertrauens_score 9, B → 6, C → 3 (siehe TIER_SCORES in radar/config.py).
# Alternativ vertrauens_score direkt angeben (überschreibt das Tier).
# Der Kanalname wird beim ersten Lauf automatisch aus der API aufgelöst.
kanaele:
  # Tier A — vertrauens_score 9
  - {handle: "@aiexplained-official", tier: A}
  - {handle: "@Fireship", tier: A}
  - {handle: "@LatentSpacePod", tier: A}
  - {handle: "@ycombinator", tier: A}
  - {handle: "@anthropic-ai", tier: A}
  - {handle: "@OpenAI", tier: A}
  - {handle: "@Google_DeepMind", tier: A}
  # Tier B — vertrauens_score 6
  - {handle: "@nateherk", tier: B}
  - {handle: "@matthew_berman", tier: B}
  - {handle: "@CorbinBrown", tier: B}
  - {handle: "@indydevdan", tier: B}
  - {handle: "@GregIsenberg", tier: B}
  - {handle: "@mreflow", tier: B}

# ---------------------------------------------------------------------------
# Discovery-Quelle B: Keyword-Suche (Ergänzung, streng budgetiert)
# ---------------------------------------------------------------------------
# Themensuche ist jetzt die Hauptquelle (nach Datum sortiert = neueste zuerst).
# Bewusst breit rund um "mit AI konkret Geld verdienen" — der Substanz-Filter in
# der Analyse trennt echte Systeme mit Zahlen von Guru-/Kurs-Clickbait.
keywords:
  - "AI automation business real results"
  - "how I make money with AI agents"
  - "AI side income automation"
  - "AI dropshipping automation system"
  - "AI micro saas revenue breakdown"
  - "n8n AI workflow business case study"
  - "AI agent build revenue numbers"
  - "AI e-commerce automation store"
  - "solo founder AI product build"
  - "AI service business how much I earn"
  - "AI lead generation system automated"
  - "AI content automation income"
  - "faceless AI business real"
  - "local-first AI app build"
  - "AI freelance automation clients"
  - "small business AI automation ROI"

# ---------------------------------------------------------------------------
# Vorfilter (billig, laufen VOR jedem LLM-Aufruf)
# ---------------------------------------------------------------------------
filter:
  max_alter_tage: 3
  min_dauer_s: 240          # < 4 Min: meist Werbung
  max_dauer_s: 10800        # > 3 h: meist Livestream-Mitschnitt
  sprachen: ["de", "en"]
  min_gesamtscore: 6.0      # gewichteter Gesamtscore-Schwellwert für den Report
  # Gewichtung der drei Analyse-Scores für den Gesamtscore (Summe wird normiert):
  score_gewichte:
    substanz: 0.4
    neuheit: 0.3
    umsetzbarkeit: 0.3
  # Bewusst knapp gehalten: nur eindeutige Scam-Signale hart aussperren.
  # Zahlen wie "$3k/month" sind jetzt ERWÜNSCHT (echte Case-Studies) — ob Beleg
  # oder Guru-Behauptung, entscheidet die inhaltliche Analyse, nicht ein Regex.
  titel_blocklist:
    - '(?i)get rich quick'
    - '(?i)millionaire|millionär'
    - '(?i)guaranteed income'
    - '(?i)quit your (job|9-?5)'
  kanal_blocklist: []       # channel_ids (UC...), die nie ausgewertet werden

# ---------------------------------------------------------------------------
# Budget & Guardrails
# ---------------------------------------------------------------------------
budget:
  youtube_quota_limit: 10000        # tägliches YouTube-Quota (Default-Kontingent)
  quota_warn_schwelle: 0.8          # ab 80% verbrauchtem Quota Suche abschalten
  suchen_pro_tag: 30                # Themensuche ist Hauptquelle → mehr Suchen (30 × 100 = 3000 Quota)
  max_llm_kosten_pro_tag_usd: 4.00  # angehoben: breiteres Netz = mehr Analysen
  max_videos_pro_tag: 80            # max. Videos, die pro Tag analysiert werden

# ---------------------------------------------------------------------------
# Transkript-Beschaffung
# ---------------------------------------------------------------------------
transkripte:
  min_pause_s: 2.0          # minimale Pause zwischen yt-dlp-Requests
  max_pause_s: 4.0
  max_retries: 4            # exponentielles Backoff bei Fehlern
  # Untertitel-Sprachen (getrennt vom Vorfilter). Nur wenige anfragen: jede
  # zusätzliche Sprache verdoppelt die Abrufe und provoziert YouTube-429er.
  # Für überwiegend englische Kanäle reicht das Original ["en"].
  sub_langs: ["en"]

# ---------------------------------------------------------------------------
# Wiederholungserkennung / Clustering
# ---------------------------------------------------------------------------
clustering:
  wiederholung_tage: 14     # Fenster, gegen das auf bereits Berichtetes geprüft wird

# ---------------------------------------------------------------------------
# Zustellung
# ---------------------------------------------------------------------------
zustellung:
  # Datei nach reports/ wird IMMER geschrieben. Zusätzlich optional:
  email:
    aktiv: false
    betreff: "AI-Business Radar — {datum}"
  telegram:
    aktiv: false

# ---------------------------------------------------------------------------
# Retention (rechtlich: Transkripte nicht dauerhaft speichern)
# ---------------------------------------------------------------------------
retention:
  transkripte_tage: 30      # Transkripte älter als N Tage werden gelöscht

# ---------------------------------------------------------------------------
# Dashboard (lokale Seite, nur 127.0.0.1)
# ---------------------------------------------------------------------------
dashboard:
  port: 8756
  auto_run: true            # startet einmal pro Tag automatisch einen Lauf
  auto_run_stunde: 7        # lokale Stunde (0-23), ab der der Tageslauf startet

# ---------------------------------------------------------------------------
# Pfade
# ---------------------------------------------------------------------------
pfade:
  db: "data/radar.db"
  reports: "reports"
  logs: "logs"
