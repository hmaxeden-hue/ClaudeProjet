  --font-display:"Bahnschrift","DIN Alternate","DIN Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
/* ===== Tokens: dunkel (System) ===== */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0A1115; --surface:#111B21; --surface-2:#16222A; --surface-3:#1D2B34;
    --line:#23343E; --line-strong:#375058;
    --ink:#E3ECEF; --ink-2:#A7B7BE; --muted:#7D8E96;
    --accent:#4DB6D7; --accent-2:#74C9E4; --accent-ink:#04202A; --accent-soft:#11303B;
    --good:#0CA30C; --good-ink:#5FD15F; --good-soft:#102A13;
    --warn:#FAB219; --warn-ink:#F6C554; --warn-soft:#2D2409;
    --bad:#D03B3B; --bad-ink:#F07A7A; --bad-soft:#351617;
    --viz-1:#3987e5; --viz-2:#d95926; --viz-3:#199e70; --viz-plan:#33454F; --viz-grid:#1F2D35; --viz-axis:#3B4D57; --viz-surface:#111B21;
    --t-easy:#199e70; --t-long:#3987e5; --t-int:#9085e9; --t-tempo:#d95926; --t-hmp:#4DB6D7;
    --t-rest:#5F7079; --t-strength:#d55181; --t-race:#e66767; --t-test:#c98500;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25);
  }
}
/* ===== Tokens: dunkel (manuell) ===== */
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0A1115; --surface:#111B21; --surface-2:#16222A; --surface-3:#1D2B34;
  --line:#23343E; --line-strong:#375058;
  --ink:#E3ECEF; --ink-2:#A7B7BE; --muted:#7D8E96;
  --accent:#4DB6D7; --accent-2:#74C9E4; --accent-ink:#04202A; --accent-soft:#11303B;
  --good:#0CA30C; --good-ink:#5FD15F; --good-soft:#102A13;
  --warn:#FAB219; --warn-ink:#F6C554; --warn-soft:#2D2409;
  --bad:#D03B3B; --bad-ink:#F07A7A; --bad-soft:#351617;
  --viz-1:#3987e5; --viz-2:#d95926; --viz-3:#199e70; --viz-plan:#33454F; --viz-grid:#1F2D35; --viz-axis:#3B4D57; --viz-surface:#111B21;
  --t-easy:#199e70; --t-long:#3987e5; --t-int:#9085e9; --t-tempo:#d95926; --t-hmp:#4DB6D7;
  --t-rest:#5F7079; --t-strength:#d55181; --t-race:#e66767; --t-test:#c98500;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25);
}

/* ===== Basis ===== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.display{font-family:var(--font-display);font-weight:700;letter-spacing:-.005em;font-variant-numeric:lining-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.small{font-size:13px}
.tiny{font-size:12px}
.eyebrow{font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.hide{display:none!important}
[hidden]{display:none!important}

/* ===== Layout ===== */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:22px 14px 18px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.brand-mark{width:34px;height:34px;flex:none;border-radius:8px;display:block}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1.05}
.brand-sub{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;gap:11px;align-items:center;width:100%;padding:9px 12px;border:0;border-radius:8px;background:transparent;color:var(--ink-2);font-weight:550;text-align:left;cursor:pointer;white-space:nowrap}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 8px}
.side-count{border-top:1px solid var(--line);padding-top:14px}
.side-count .display{font-size:34px;line-height:1}
.store-badge{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.store-badge.bad{color:var(--bad-ink)}
.theme-btn{align-self:flex-start;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;color:var(--ink-2)}
main{padding:28px clamp(16px,3.2vw,44px) 72px;width:100%;max-width:1320px;min-width:0}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.view-head h1{font-family:var(--font-display);font-size:34px;font-weight:700}
.view-head p{color:var(--ink-2);max-width:62ch}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:auto;flex-direction:row;align-items:center;gap:12px;padding:8px 16px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .brand{padding:0}
  .brand-text,.side-foot .side-count,.store-badge{display:none}
  .brand-mark{width:28px;height:28px}
  .nav{flex-direction:row}
  .nav button{padding:8px 10px;font-size:14px}
  .nav button svg{display:none}
  .side-foot{margin:0;padding:0}
  main{padding:18px 16px 56px}
  .view-head h1{font-size:28px}
}

/* ===== Bausteine ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.card.lift{box-shadow:var(--shadow)}
.card h3{font-size:16px;font-weight:700;margin-bottom:10px}
.section-title{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}
@media (max-width:1100px){.g-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:980px){.g-dash{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){.g-2,.g-3{grid-template-columns:minmax(0,1fr)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:650;font-size:14px;cursor:pointer;line-height:1.2;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--bad-ink);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:650;background:var(--surface-3);color:var(--ink-2);white-space:nowrap;line-height:1.35}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.tchip i{width:9px;height:9px;border-radius:3px}

.amp{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.amp svg{width:13px;height:13px;flex:none}
.amp.g{background:var(--good-soft);color:var(--good-ink)}
.amp.y{background:var(--warn-soft);color:var(--warn-ink)}
.amp.r{background:var(--bad-soft);color:var(--bad-ink)}
.amp.n{background:var(--surface-3);color:var(--ink-2)}

.note{border-radius:var(--radius-sm);padding:10px 14px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn-ink)}
.note.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad-ink)}
.note.good{background:var(--good-soft);border-color:transparent;color:var(--good-ink)}
.note.accent{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.note strong{color:inherit}

/* ===== Formulare ===== */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lbl{font-size:12px;font-weight:650;color:var(--ink-2);letter-spacing:.02em}
.field .hint{font-size:12px;color:var(--muted)}
.field.wide{grid-column:1/-1}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);min-width:0}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:7px 12px;cursor:pointer;font-weight:650;font-size:14px;color:var(--ink-2);border-right:1px solid var(--line);min-width:38px;text-align:center}
.seg label:last-of-type{border-right:0}
.field > .seg{align-self:flex-start}
.seg input:checked+label{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:-2px}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick label{position:relative}
.daypick input{position:absolute;opacity:0}
.daypick span{display:inline-block;padding:6px 11px;border-radius:8px;border:1px solid var(--line-strong);font-weight:650;cursor:pointer;color:var(--ink-2);min-width:42px;text-align:center}
.daypick input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.daypick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.check.field{flex-direction:row}
.save-bar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;box-shadow:var(--shadow)}

/* ===== Tabellen ===== */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.nowrap{white-space:nowrap}
td.wos{min-width:280px}
tbody tr.hl td{background:var(--accent-soft)}

/* ===== Dashboard ===== */
.dash-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.dash-head h1{font-family:var(--font-display);font-size:36px}
.count{display:flex;align-items:center;gap:14px}
.count .big{font-size:64px;line-height:.85;color:var(--accent)}
.count .lbl{font-size:14px;line-height:1.3;color:var(--ink-2)}
.count .lbl strong{color:var(--ink);font-size:16px}

.band{margin:4px 0 22px}
.band-track{display:flex;height:34px;border-radius:9px;overflow:hidden;position:relative;background:var(--surface-3)}
.band-seg{position:relative;display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;border-right:2px solid var(--bg)}
.band-seg:last-child{border-right:0}
.band-seg.build{background:color-mix(in srgb,var(--t-easy) 26%,var(--surface))}
.band-seg.peak{background:color-mix(in srgb,var(--t-tempo) 30%,var(--surface))}
.band-seg.taper{background:color-mix(in srgb,var(--t-long) 26%,var(--surface))}
.band-seg.race{background:color-mix(in srgb,var(--t-race) 30%,var(--surface))}
.band-done{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(135deg,rgba(0,0,0,.07) 0 6px,transparent 6px 12px);pointer-events:none}
.band-marker{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--ink);border-radius:2px;pointer-events:none}
.band-marker::after{content:attr(data-label);position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;color:var(--ink);white-space:nowrap}
.band-dates{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}

.today{position:relative;padding:22px 24px}
.today-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.today-title{font-size:clamp(30px,4vw,44px);margin:12px 0 4px}
.today-sub{color:var(--ink-2);font-size:15px}
.planned-was{font-size:13px;color:var(--muted);margin-top:4px}
.planned-was s{text-decoration-thickness:1px}
.metrics{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:18px 0}
.metric{background:var(--surface);padding:10px 12px;flex:1 1 auto;min-width:90px}
.metric .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.metric .v{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.metric .v small{font-size:13px;font-weight:600;color:var(--ink-2);font-family:var(--font-body)}
.steps{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 16px;margin:0}
.steps dt{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding-top:2px}
.steps dd{margin:0;color:var(--ink)}
@media (max-width:520px){.steps{grid-template-columns:minmax(0,1fr)}.steps dd{margin-bottom:6px}}
.why{margin-top:16px;border-radius:10px;padding:12px 14px}
.why.y{background:var(--warn-soft);color:var(--warn-ink)}
.why.r{background:var(--bad-soft);color:var(--bad-ink)}
.why.g{background:var(--good-soft);color:var(--good-ink)}
.why.n{background:var(--surface-2);color:var(--ink-2)}
.why ul{margin:6px 0 0;padding-left:18px}
.why li{margin:2px 0}
.why .lead{font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.done-flag{display:inline-flex;align-items:center;gap:6px;color:var(--good-ink);font-weight:700}

.rd-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rd{background:var(--surface-2);border-radius:9px;padding:10px 12px}
.rd .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rd .v{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.rd .d{font-size:12px;color:var(--ink-2)}
.rd .d.up{color:var(--bad-ink)}
.rd .d.down{color:var(--bad-ink)}
.rd .d.ok{color:var(--good-ink)}

.progress{height:12px;border-radius:999px;background:var(--surface-3);overflow:hidden;position:relative}
.progress > span{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:999px}
.progress.over > span{background:var(--warn)}
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
.wday{border-radius:8px;padding:7px 4px 6px;text-align:center;background:var(--surface-2);border:1px solid transparent;min-width:0}
.wday.is-today{border-color:var(--accent);background:var(--accent-soft)}
.wday .wd{font-size:11px;font-weight:700;color:var(--muted)}
.wday .bar{height:5px;border-radius:3px;margin:5px 6px}
.wday .km{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.wday .st{font-size:11px;height:15px;line-height:15px}
.st-done{color:var(--good-ink)} .st-missed{color:var(--bad-ink)} .st-skipped{color:var(--muted)}

.tip{display:flex;gap:14px;align-items:flex-start}
.tip-cat{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.tip p{font-size:15px;margin-top:4px}
.assess-lvl{font-family:var(--font-display);font-weight:700;font-size:22px}
.need-list{margin:8px 0 0;padding-left:18px}
.need-list li{margin:3px 0}
.next-list{display:flex;flex-direction:column}
.next-item{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.next-item:last-child{border-bottom:0}
.next-item .d{font-weight:700;font-size:14px}
.next-item .t{font-weight:650}
.next-item .s{font-size:13px;color:var(--ink-2)}

/* ===== Plan ===== */
.week{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.week.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.week-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding:14px 18px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.week-head h3{font-family:var(--font-display);font-size:20px}
.week-km{display:flex;gap:12px;align-items:center;min-width:220px;flex:1;max-width:360px}
.week-km .progress{flex:1}
.day-row{border-bottom:1px solid var(--line)}
.day-row:last-child{border-bottom:0}
.day-row summary{list-style:none;display:grid;grid-template-columns:34px 86px 130px minmax(0,1fr) 70px 96px;gap:10px;align-items:center;padding:10px 18px;cursor:pointer}
.day-row summary::-webkit-details-marker{display:none}
.day-row summary:hover{background:var(--surface-2)}
.day-row.is-today summary{background:var(--accent-soft)}
.day-row .dname{font-weight:700;font-size:14px}
.day-row .dname span{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.day-row .ttl{font-weight:650;min-width:0}
.day-row .ttl small{display:block;font-weight:500;color:var(--ink-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-row .km{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.day-row .stat{text-align:right;font-size:12px;font-weight:700}
.day-body{padding:4px 18px 16px 148px;display:flex;flex-direction:column;gap:12px}
.cbx{width:22px;height:22px;border-radius:6px;border:2px solid var(--line-strong);display:grid;place-items:center;background:var(--surface);cursor:pointer;padding:0}
.cbx.on{background:var(--good);border-color:var(--good)}
.cbx.on svg{stroke:#fff}
.cbx svg{width:14px;height:14px;fill:none;stroke:transparent;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cbx.skip{background:var(--surface-3)}
.cbx:disabled{visibility:hidden}
@media (max-width:760px){
  .day-row summary{grid-template-columns:28px 64px minmax(0,1fr) 54px;padding:10px 14px;gap:8px}
  .day-row summary .tcol,.day-row summary .stat{display:none}
  .day-body{padding:4px 14px 14px}
}

/* ===== Charts ===== */
.chart{position:relative;width:100%;min-height:120px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font-size:11px;fill:var(--muted);font-family:var(--font-body)}
.chart .ax-strong{font-size:11px;fill:var(--ink-2);font-weight:650}
.tt{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:12px;min-width:120px;z-index:5;white-space:nowrap}
.tt .tt-d{color:var(--muted);font-weight:650;margin-bottom:4px}
.tt .tt-r{display:flex;align-items:center;gap:8px}
.tt .tt-r b{font-size:14px;font-variant-numeric:tabular-nums}
.tt .key{width:12px;height:3px;border-radius:2px;display:inline-block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:2px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ln{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend .bx{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart-empty{display:grid;place-items:center;min-height:160px;color:var(--muted);font-size:14px;text-align:center;border:1px dashed var(--line-strong);border-radius:10px;padding:16px}
details.tbl summary{cursor:pointer;font-size:13px;color:var(--ink-2);margin-top:8px}
details.tbl .table-wrap{margin-top:8px;max-height:280px;overflow:auto}
.stat-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat-tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat-tile .k{font-size:12px;color:var(--muted);font-weight:650}
.stat-tile .v{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.1}
.stat-tile .d{font-size:12px;color:var(--ink-2)}

/* ===== Wettkampf ===== */
.race-hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
@media (max-width:900px){.race-hero{grid-template-columns:minmax(0,1fr)}}
.race-time{font-size:56px;line-height:1;color:var(--accent)}
.split-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
@media (max-width:600px){.split-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.split-card{background:var(--surface-2);border-radius:9px;padding:10px 12px}
.split-card .k{font-size:12px;color:var(--muted);font-weight:650}
.split-card .v{font-family:var(--font-display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.seg-list{display:flex;flex-direction:column;gap:0}
.seg-item{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.seg-item:last-child{border-bottom:0}
.seg-item .km{font-family:var(--font-display);font-weight:700;font-size:17px}
.seg-item .km small{display:block;font-family:var(--font-body);font-size:12px;font-weight:650;color:var(--accent)}
.timeline{display:flex;flex-direction:column}
.tl-item{display:grid;grid-template-columns:70px minmax(0,1fr);gap:14px;padding:9px 0;border-bottom:1px dashed var(--line)}
.tl-item:last-child{border-bottom:0}
.tl-item .t{font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
ul.clean{margin:0;padding-left:18px}
ul.clean li{margin:4px 0}
.checklist{display:flex;flex-direction:column;gap:8px}
.checklist .check span{flex:1}
.checklist .check input:checked + span{color:var(--muted);text-decoration:line-through}
.hill-km-row td.hill{color:var(--warn-ink);font-weight:700}

/* ===== Fokus & Leitfaden ===== */
.focus-list{display:flex;flex-direction:column;gap:12px}
.focus-item{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;font-size:14px}
.focus-k{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);padding-top:2px}
@media (max-width:520px){.focus-item{grid-template-columns:minmax(0,1fr);gap:2px}}
.guide{margin-bottom:16px}
.guide h2{font-family:var(--font-display);font-size:24px;font-weight:700}
.guide p + p,.guide p + ul,.guide ul + p{margin-top:10px}
.guide .lead{font-size:16px;color:var(--ink-2);max-width:75ch;margin-top:8px}
.benefits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}
@media (max-width:720px){.benefits{grid-template-columns:minmax(0,1fr)}}
.benefit{background:var(--surface-2);border-radius:10px;padding:12px 14px}
.benefit strong{display:block;margin-bottom:4px}
.miles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:4px 0 20px}
.mile{border-top:3px solid var(--line-strong);padding-top:8px;min-width:0}
.mile .d{font-weight:800;font-variant-numeric:tabular-nums}
.mile .k{font-weight:650;font-size:14px}
.mile .t{font-size:12px;color:var(--ink-2)}
.mile.now{border-color:var(--accent)}
.mile.now .d{color:var(--accent)}
.mile.past{opacity:.55}
.sugar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.icon-preview{display:flex;gap:14px;align-items:end;flex-wrap:wrap;margin:6px 0 12px}
.icon-preview img{display:block}

/* ===== Import ===== */
.drop{border:2px dashed var(--line-strong);border-radius:var(--radius);padding:28px;text-align:center;background:var(--surface);transition:background .15s}
.drop.over{background:var(--accent-soft);border-color:var(--accent)}
.drop p{color:var(--ink-2);margin-top:6px}
.badge-new{color:var(--good-ink);font-weight:700}
.badge-upd{color:var(--accent);font-weight:700}
.badge-dup{color:var(--muted);font-weight:700}

/* ===== Modal & Toast ===== */
.modal{position:fixed;inset:0;background:rgba(6,14,18,.5);display:grid;place-items:center;z-index:100;padding:16px}
.modal-card{background:var(--surface);border-radius:14px;padding:22px;max-width:520px;width:100%;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px;max-height:90vh;overflow:auto}
.modal-card h3{font-family:var(--font-display);font-size:22px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:650;font-size:14px;z-index:120;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){
  .view{animation:fade .18s ease-out}
  @keyframes fade{from{opacity:.6;transform:translateY(3px)}to{opacity:1;transform:none}}
}

(function(){

const HM = 21.0975;

/* ---------- Hilfsfunktionen ---------- */
const $ = (s, r) => (r || document).querySelector(s);

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const fromISO = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || '')); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dayDiff = (a, b) => Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 864e5);
const wdIdx = d => (d.getDay() + 6) % 7;
const mondayOf = d => addDays(d, -wdIdx(d));
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const todayISO = () => isoOf(today());
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const r05 = x => Math.round(x * 2) / 2;
const isNum = v => typeof v === 'number' && isFinite(v);
const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function fmtDur(sec, forceH){
  if (!isNum(sec)) return '–';
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h || forceH) ? h + ':' + pad2(m) + ':' + pad2(s) : m + ':' + pad2(s);
}
function fmtPace(sec){ if (!isNum(sec) || sec <= 0) return '–'; sec = Math.round(sec); return Math.floor(sec / 60) + ':' + pad2(sec % 60); }
function fmtMin(min){ min = Math.round(min); return min < 60 ? min + ' min' : Math.floor(min / 60) + ' h ' + pad2(min % 60); }
function fmtKm(k){ if (!isNum(k)) return '–'; const v = Math.round(k * 10) / 10; return v % 1 === 0 ? String(v) : v.toFixed(1); }
function fmtH(h){ if (!isNum(h)) return '–'; const m = Math.round(h * 60); return Math.floor(m / 60) + ':' + pad2(m % 60) + ' h'; }
const fmtDM = d => pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.';
const fmtDS = d => WD[wdIdx(d)] + ' ' + fmtDM(d);
const fmtDL = d => WDL[wdIdx(d)] + ', ' + d.getDate() + '. ' + MON[d.getMonth()] + ' ' + d.getFullYear();
const fmtDMY = d => fmtDM(d) + d.getFullYear();
function paceRange(c, spread){ spread = spread == null ? 3 : spread; return fmtPace(c - spread) + '–' + fmtPace(c + spread); }

function parseNum(v){
  if (v == null) return null;
  let s = String(v).trim().replace(/['\s]/g, '');
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc >= 0 && ld >= 0) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (lc >= 0) s = s.split(',').length > 2 ? s.replace(/,/g, '') : s.replace(',', '.');
  s = s.replace(/[^\d.\-]/g, '');
  if (s === '' || s === '-' || s === '.') return null;
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
/* "1:45:00" → s, "48:30" → s (mm:ss), "52" → Minuten */
function parseDur(str){
  if (str == null) return null;
  str = String(str).trim().replace(',', '.');
  if (!str) return null;
  const hm = /^(\d+)\s*h\s*(\d+)?/i.exec(str);
  if (hm) return (+hm[1]) * 3600 + (+(hm[2] || 0)) * 60;
  const p = str.split(':').map(Number);
  if (p.some(x => !isFinite(x))) return null;
  if (p.length === 3) return p[0] * 3600 + p[1] * 60 + p[2];
  if (p.length === 2) return p[0] * 60 + p[1];
  if (p.length === 1) return p[0] * 60;
  return null;
}
/* Zielzeit Halbmarathon: "1:45" = 1 h 45 min */
function parseGoal(str){
  if (str == null) return null;
  const s = String(str).trim();
  const p = s.split(':');
  if (p.length === 2 && +p[0] <= 4) return (+p[0]) * 3600 + (+p[1]) * 60;
  return parseDur(s);
}
function parsePace(str){
  if (str == null || String(str).trim() === '') return null;
  const s = String(str).trim().replace(',', '.');
  if (s.includes(':')) { const [m, sec] = s.split(':').map(Number); return isFinite(m) && isFinite(sec) ? m * 60 + sec : null; }
  const n = parseFloat(s); if (!isFinite(n)) return null;
  return n < 20 ? Math.round(n * 60) : n; /* 4.97 min → s */
}
function parseHours(str){
  if (str == null || String(str).trim() === '') return null;
  const s = String(str).trim();
  if (s.includes(':')) { const [h, m] = s.split(':').map(Number); return isFinite(h) && isFinite(m) ? h + m / 60 : null; }
  return parseNum(s);

/* ---------- Zustand ---------- */
const STORE_KEY = 'hmCockpit.v1';
const DEF = {
  name: '', age: null, sex: '', weight: null, hrMax: null,
  weeklyKm: 30, longestRun: 14, refDist: 10, refTime: null,
  runDays: [1, 3, 5, 6], longDay: 6, strengthPerWeek: 2,
  otherSports: '', injuries: '', cautious: false, load: 'normal', qPerWeek: 'auto',
  recBase: null, hrvBase: null, rhrBase: null,
  raceName: 'Swiss City Marathon Luzern – Halbmarathon', raceDate: '2026-10-25',
  goalTime: 6300, paceBasis: 'auto', planStart: null, hillKm: '6-11', refRaceId: null,
  theme: 'auto', profileSaved: false
};
function defaultState(){

function normalizeState(st){

  if (!['vorsichtig', 'normal', 'ambitioniert'].includes(out.settings.load)) out.settings.load = 'normal';
  if (!Array.isArray(out.settings.runDays)) out.settings.runDays = DEF.runDays.slice();
  if (!fromISO(out.settings.planStart)) out.settings.planStart = todayISO();
  if (!fromISO(out.settings.raceDate)) out.settings.raceDate = DEF.raceDate;
  ['days', 'checks', 'swaps', 'raceCheck'].forEach(k => { if (!out[k] || typeof out[k] !== 'object' || Array.isArray(out[k])) out[k] = {}; });

/* ---------- Coach-Einschätzung ---------- */
function riegel(t, d1, d2){ return t * Math.pow(d2 / d1, 1.06); }
function assess(){
  const s = S.settings, t0 = today(), race = fromISO(s.raceDate);
  const daysLeft = dayDiff(t0, race);
  const r = { daysLeft, goal: s.goalTime, hasRef: !!(isNum(s.refTime) && s.refTime > 0 && isNum(s.refDist) && s.refDist > 0), factors: [] };
  const buildDays = Math.max(0, daysLeft - 12);
  r.gain = Math.min(0.03, buildDays / 7 * 0.006);
  r.need10k = s.goalTime / Math.pow(HM / 10, 1.06);
  r.need5k = s.goalTime / Math.pow(HM / 5, 1.06);
  if (r.hasRef) {
    const rr = S.races.find(x => x.id === s.refRaceId && Math.abs(x.time - s.refTime) < 1);
    r.basis = rr ? (rr.name ? '«' + rr.name + '», ' : '') + distLabel(rr.dist) + ' vom ' + fmtDMY(fromISO(rr.date)) + ' in ' + fmtDur(rr.time)
                 : distLabel(s.refDist) + ' in ' + fmtDur(s.refTime) + ' (aus den Einstellungen)';
    if (rr) { const wk = Math.floor(dayDiff(fromISO(rr.date), t0) / 7); if (wk > 8) r.factors.push('Die Referenz ist ' + wk + ' Wochen alt – ohne aktuelles Rennen bleibt die Prognose unsicher.'); }
    r.pred = riegel(s.refTime, s.refDist, HM);
    let adj = 0;
    if (s.weeklyKm < 20) { adj += 0.04; r.factors.push('Wochenumfang unter 20 km – die Ausdauer limitiert (+4 %).'); }
    else if (s.weeklyKm < 30) { adj += 0.02; r.factors.push('Wochenumfang ' + s.weeklyKm + ' km – für 21 km eher knapp (+2 %).'); }
    else if (s.weeklyKm < 40) { adj += 0.005; }
    if (s.longestRun < 10) { adj += 0.03; r.factors.push('Längster Lauf ' + s.longestRun + ' km – weit unter der Renndistanz (+3 %).'); }
    else if (s.longestRun < 14) { adj += 0.015; r.factors.push('Längster Lauf ' + s.longestRun + ' km – die Long Runs müssen noch wachsen (+1.5 %).'); }
    if (s.refDist < 9) { adj += 0.02; r.factors.push('Hochrechnung von ' + distLabel(s.refDist) + ' auf 21.1 km fällt meist zu optimistisch aus (+2 %).'); }
    else if (s.refDist < 14) { adj += 0.01; r.factors.push('Hochrechnung von ' + distLabel(s.refDist) + ' auf 21.1 km: +1 % Sicherheitsmarge.'); }
    if (r.gain > 0.001) r.factors.push('Mögliche Formverbesserung bis zum Tapering: ca. ' + (r.gain * 100).toFixed(1) + ' %.');
    r.adj = adj;
    r.realistic = Math.ceil(r.pred * (1 + adj) * (1 - r.gain) / 30) * 30;
    r.diff = (s.goalTime - r.realistic) / r.realistic;
    r.level = r.diff >= 0 ? 'ok' : r.diff >= -0.02 ? 'ambitious' : r.diff >= -0.05 ? 'stretch' : 'unrealistic';
  } else r.level = 'unknown';
  if (s.paceBasis === 'goal' || !r.hasRef) r.planTime = s.goalTime;
  else if (s.paceBasis === 'realistic') r.planTime = r.realistic;
  else r.planTime = (r.level === 'stretch' || r.level === 'unrealistic') ? r.realistic : s.goalTime;
  r.planIsGoal = r.planTime === s.goalTime;
  return r;
}

/* ---------- Planung ---------- */
function circDist(a, b){ const d = Math.abs(a - b); return Math.min(d, 7 - d); }
function pickQDays(runDays, longDay, n){
  const c = runDays.filter(d => d !== longDay);
  if (!c.length || n < 1) return [];
  const combos = n >= 2 ? c.flatMap((a, i) => c.slice(i + 1).map(b => [a, b])) : c.map(a => [a]);
  let best = null, bestScore = -1e9;
  combos.forEach(combo => {
    const pts = [longDay].concat(combo);
    let minD = 7;
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) minD = Math.min(minD, circDist(pts[i], pts[j]));
    const afterLong = combo.some(q => (q - longDay + 7) % 7 === 1) ? 1 : 0;
    const score = minD * 10 - afterLong * 5 - combo.reduce((x, y) => x + y, 0) * 0.01;
    if (score > bestScore) { bestScore = score; best = { combo, minD }; }
  });
  if (n >= 2 && best.minD < 2) return pickQDays(runDays, longDay, 1);
  return best.combo.slice().sort((a, b) => a - b);
}

function longSpecFor(role, bi, km, isRec){

function buildPlan(A){
  const s = S.settings, P = paceSet(A.planTime);
  const start = fromISO(s.planStart) || today(), race = fromISO(s.raceDate);
  const plan = { P, weeks: [], byDate: {}, start, race, qDays: [], longDay: null };
  if (!race || race < start) return plan;
  const m0 = mondayOf(start), mR = mondayOf(race);
  const nW = Math.round(dayDiff(m0, mR) / 7) + 1;
  let runDays = Array.from(new Set((s.runDays || []).map(Number))).filter(d => d >= 0 && d <= 6).sort((a, b) => a - b);
  if (runDays.length < 2) runDays = [1, 3, 6];
  const longDay = runDays.includes(+s.longDay) ? +s.longDay : runDays[runDays.length - 1];
  const base = Math.max(10, +s.weeklyKm || 25);
  /* Belastbarkeit: steuert Steigerung, Anzahl und Umfang der Qualitätseinheiten sowie die Länge der lockeren Läufe */
  const LP = {
    vorsichtig:   { inc: 0.05, longInc: 1,   capF: 1.2,  tol: [1.08, 1.04], minE: [4, 5], maxE: [10, 12], qx: -1 },
    normal:       { inc: 0.07, longInc: 1.5, capF: 1.3,  tol: [1.12, 1.06], minE: [4, 5], maxE: [12, 14], qx: 0 },
    ambitioniert: { inc: 0.10, longInc: 2,   capF: 1.45, tol: [1.2, 1.15], minE: [6, 6], maxE: [14, 16], qx: 1 }
  }[s.load] || null;
  const lp = LP || { inc: 0.07, longInc: 1.5, capF: 1.3, tol: [1.12, 1.06], minE: [4, 5], maxE: [12, 14], qx: 0 };
  plan.load = s.load;
  /* Qualitätstage: fix gewählt oder automatisch nach Belastbarkeit, Lauftagen und Umfang */
  const autoQ = s.load === 'ambitioniert' ? (runDays.length >= 3 ? 2 : 1)

  const nQ = s.qPerWeek === '1' || s.qPerWeek === 1 ? 1 : s.qPerWeek === '2' || s.qPerWeek === 2 ? 2 : autoQ;
  const qDays = pickQDays(runDays, longDay, nQ);
  const single = qDays.length < 2;
  plan.qDays = qDays; plan.longDay = longDay; plan.runDays = runDays;
  const lvl = clamp((base - 20) / 30, 0, 1);

  const roles = [];
  for (let w = 0; w < nW; w++) { const e = nW - 1 - w; roles.push(e === 0 ? 'race' : e === 1 ? 'taper' : e === 2 ? 'peak' : 'build'); }
  const nBuild = roles.filter(r => r === 'build').length;
  if (nBuild >= 8) { const nb = Math.floor(nBuild / 2); for (let w = 0; w < nb; w++) roles[w] = 'base'; }

  const inc = lp.inc, longInc = lp.longInc;
  const capF = base >= 60 ? 1.1 + (lp.qx > 0 ? 0.05 : 0) : base >= 45 ? 1.2 + (lp.qx > 0 ? 0.1 : 0) : lp.capF;
  const capLong = s.load === 'vorsichtig' ? 20 : s.load === 'ambitioniert' ? (base >= 40 ? 22 : 21) : (base >= 45 ? 22 : 20);
  const L0 = clamp(+s.longestRun || 10, 5, Math.min(24, Math.max(12, base * 0.55)));
  const vol = [], lng = [], recW = [], bIdx = [];
  let lastF = 1, lastL = L0, bi = 0;
  for (let w = 0; w < nW; w++) {

    if (r === 'base' || r === 'build') {

      bIdx.push(bi);
      if (isRec) { vol.push(base * lastF * 0.8); lng.push(Math.max(8, r05(lastL * 0.8))); recW.push(true); }
      else {
        const ff = bi === 0 ? 1 : Math.min(capF, lastF + inc);
        lastF = ff; const v = base * ff; vol.push(v);
        const l = Math.min(bi === 0 ? L0 + longInc : lastL + longInc, capLong, Math.max(L0, 0.5 * v));
        lastL = r05(l); lng.push(lastL); recW.push(false);
      }
      bi++;
    } else if (r === 'peak') {
      bIdx.push(-1);
      const ff = nBuild ? Math.min(capF + 0.05, lastF + inc) : 1;
      lastF = ff; const v = base * ff; vol.push(v);
      lastL = r05(Math.min(lastL + longInc, capLong, Math.max(L0, 0.52 * v))); lng.push(lastL); recW.push(false);

  let testPlaced = A.hasRef;
  for (let w = 0; w < nW; w++) {
    const mon = addDays(m0, 7 * w), role = roles[w], V = vol[w];
    const week = { idx: w, mon, sun: addDays(mon, 6), role, rec: recW[w], label: recW[w] ? 'Erholungswoche' : ROLE_LABEL[role], days: [], volTarget: V };
    const slots = new Array(7).fill(null);
    if (role !== 'race') {
      runDays.forEach(d => { slots[d] = { k: 'easy' }; });
      slots[longDay] = { k: 'long', spec: longSpecFor(role, bIdx[w], lng[w], recW[w]) };
      qDays.forEach((d, i) => {
        const sp = qSpecFor(i + 1, role, bIdx[w], recW[w], lvl, single, lp.qx);
        if (lp.qx > 0) { if (isNum(sp.min)) sp.min += sp.meters === 600 ? 2 : 1; if (isNum(sp.minMin)) sp.minMin += 2; }
        slots[d] = { k: 'q', spec: sp };
      });

        for (let di = 0; di < 7; di++) {

      }
    } else {
      const cands = [];
      for (let di = 0; di < 7; di++) {
        const dtr = dayDiff(addDays(mon, di), race);
        if (dtr === 0) slots[di] = { k: 'race' };
        else if (dtr < 0) slots[di] = { k: 'none' };

        else if (sl.k === 'test') x = sTest(P, lvl);
        else if (sl.k === 'check') x = sCheck(P);
        else if (sl.k === 'shake') x = sShake(P);
        else if (sl.k === 'race') x = sRace(P, A.planTime);

      });

      const easyMin = easyFloor != null ? easyFloor : null;
      const minE = role === 'race' || role === 'taper' ? Math.min(5, lp.minE[base < 35 ? 0 : 1]) : lp.minE[base < 35 ? 0 : 1];
      const maxE = role === 'race' ? 6 : role === 'taper' ? 8 : lp.maxE[lvl > 0.6 ? 1 : 0];

      const ek = clamp(r05(per), easyMin != null ? Math.min(minE, easyMin) : minE, maxE);
      let stridesGiven = false;
      slots.forEach((sl, di) => {
        if (!sl || sl.k !== 'easy') return;

        if (!strides && !stridesGiven && (role === 'build' || role === 'peak' || role === 'base')) {
          const next = slots[(di + 1) % 7];

        }

    };

    const runLeft = runDays.filter(inPlan).length;

/* Phase eines Tages (Tapering beginnt 11 Tage vor dem Rennen) */
function phaseOf(iso){
  const d = fromISO(iso), race = fromISO(S.settings.raceDate);
  const dtr = dayDiff(d, race);
  if (dtr === 0) return { key: 'raceday', label: 'Renntag' };
  if (dtr < 0) return { key: 'post', label: 'Erholung nach dem Rennen' };
  const ses = CUR.PLAN.byDate[iso];
  let role = ses ? ses.role : null;
  if (!role) { const wk = CUR.PLAN.weeks.find(w => d >= w.mon && d <= w.sun); role = wk ? wk.role : (dtr <= 6 ? 'race' : dtr <= 11 ? 'taper' : 'build'); }
  if (role === 'taper' && dtr > 11) role = 'peak';
  return { key: role, label: ROLE_LABEL[role] };
}

/* ---------- Effektive Einheiten (inkl. Verschiebungen) & Status ---------- */
function sessionOn(iso){
  const src = S.swaps[iso];
  if (src) {
    const b = CUR.PLAN.byDate[src];
    return Object.assign({}, b || sRest(), { date: iso, movedFrom: src });
  }
  return CUR.PLAN.byDate[iso] || null;
}
function runWorkouts(iso){ return S.workouts.filter(w => w.date === iso && w.sport === 'run'); }
function statusOf(iso){
  const c = S.checks[iso];
  if (c === 'done' || c === 'skipped') return c;
  const ses = sessionOn(iso);
  if (c !== 'open' && ses && isRun(ses.type) && runWorkouts(iso).length) return 'done';
  if (ses && (isRun(ses.type) || ses.type === 'strength') && iso < todayISO()) return 'missed';
  return 'open';
}
function weekActualKm(mon){
  const a = isoOf(mon), b = isoOf(addDays(mon, 6));
  return S.workouts.filter(w => w.sport === 'run' && w.date >= a && w.date <= b).reduce((x, w) => x + (w.dist || 0), 0);
}
function weekForDate(iso){ const d = fromISO(iso); return CUR.PLAN.weeks.find(w => d >= w.mon && d <= w.sun) || null; }
function canMove(iso){
  if (S.swaps[iso]) return false;
  const d = fromISO(iso), t1 = isoOf(addDays(d, 1)), t2 = isoOf(addDays(d, 2));
  if (S.swaps[t1]) return false;
  const tom = CUR.PLAN.byDate[t1], after = sessionOn(t2);
  if (!tom || !['easy', 'rest', 'strength'].includes(tom.type)) return false;
  if (after && isHard(after.type)) return false;
  if (dayDiff(addDays(d, 1), fromISO(S.settings.raceDate)) < 3) return false;
  return true;
}
function missedAdvice(iso){
  const ses = sessionOn(iso); if (!ses) return '';
  const ph = phaseOf(iso).key;
  const daysAgo = dayDiff(fromISO(iso), today());
  if (ph === 'taper' || ph === 'race') return 'Nicht nachholen – im Tapering geht Frische vor. Einfach mit dem Plan weitermachen.';
  if (ses.type === 'easy' || ses.type === 'shakeout') return 'Nicht nachholen. Ein verpasster lockerer Lauf kostet keine Form – der Plan geht normal weiter.';
  if (ses.type === 'strength') return 'Bei Gelegenheit an einem lockeren Tag nachholen oder weglassen.';
  if (ses.type === 'test') return 'Den Test am nächsten Qualitätstag anstelle der geplanten Einheit machen – nicht zusätzlich.';
  const t = today(), tSes = sessionOn(isoOf(t)), tomSes = sessionOn(isoOf(addDays(t, 1)));
  const todayEasy = tSes && ['easy', 'rest', 'strength'].includes(tSes.type);
  const tomorrowHard = tomSes && isHard(tomSes.type);
  if (ses.type === 'long') {
    if (daysAgo <= 2 && todayEasy && !tomorrowHard) return 'Option: heute um 20 % gekürzt nachholen (statt der lockeren Einheit), falls die Recovery grün ist. Den nächsten Long Run NICHT verlängern.';
    return 'Streichen. Der nächste Long Run bleibt wie geplant – nicht verlängern, um aufzuholen.';
  }
  if (daysAgo === 1 && todayEasy && !tomorrowHard) return 'Option: heute statt der lockeren Einheit nachholen, falls die Recovery grün ist. Sonst streichen – nie zwei harte Tage hintereinander.';
  return 'Streichen, nicht nachholen. Zwei harte Tage hintereinander oder eine überladene Woche erhöhen das Verletzungsrisiko mehr, als die Einheit nützt.';

/* ---------- Tagesform & Anpassung ---------- */
function baseline(iso, field){
  const d = fromISO(iso), vals = [];
  for (let i = 1; i <= 7; i++) { const e = S.days[isoOf(addDays(d, -i))]; if (e && isNum(e[field])) vals.push(e[field]); }
  if (vals.length >= 3) return { avg: mean(vals), n: vals.length };
  const fb = field === 'hrv' ? S.settings.hrvBase : field === 'rhr' ? S.settings.rhrBase : field === 'recovery' ? S.settings.recBase : null;
  return isNum(fb) ? { avg: fb, n: 0, fallback: true } : null;
}
function readiness(iso){
  const d = S.days[iso];
  if (!d) return null;
  const items = [];

  if (isNum(d.recovery)) {
    base = d.recovery >= 67 ? 0 : d.recovery >= 34 ? 1 : 2;
    items.push({ sev: base, text: 'Recovery ' + Math.round(d.recovery) + ' % (' + ['grün', 'gelb', 'rot'][base] + ')' });
  }
  const mods = [];
  const hb = baseline(iso, 'hrv');
  if (isNum(d.hrv) && hb) {

      const kind = wd === 6 ? 'long' : wd === 1 ? 'q' : wd === 3 ? 'q' : 'easy';

function metricsHtml(ses){
  if (!ses) return '';

  if (isRun(ses.type) && ses.km) cells.push(['Distanz', fmtKm(ses.km) + ' <small>km</small>']);
  if (ses.min) cells.push(['Dauer ca.', fmtMin(ses.min)]);
  if (ses.paceTxt && isRun(ses.type)) cells.push(['Pace', esc(ses.paceTxt) + ' <small>/km</small>']);
  if (ses.hrKey) cells.push(['Puls', hrTxt(ses.hrKey) + ' <small>' + ZONES[ses.hrKey][2] + '</small>']);
  if (ses.rpe || ses.hrKey) cells.push(['RPE', esc(ses.rpe || ZONES[ses.hrKey][3]) + ' <small>/10</small>']);
  if (!cells.length) return '';
  return '<div class="metrics">' + cells.map(c => '<div class="metric"><div class="k">' + c[0] + '</div><div class="v">' + c[1] + '</div></div>').join('') + '</div>';

function stepsHtml(ses){

function phaseBand(){
  const P = CUR.PLAN; if (!P.weeks.length) return '';
  const start = P.start, race = P.race, total = dayDiff(start, race) + 1, t = today();
  const segs = [];
  for (let i = 0; i < total; i++) {
    const iso = isoOf(addDays(start, i));
    let k = phaseOf(iso).key; if (k === 'base') k = 'build'; if (k === 'raceday') k = 'race';
    if (segs.length && segs[segs.length - 1].k === k) segs[segs.length - 1].n++;
    else segs.push({ k, n: 1, from: addDays(start, i) });
  }
  const lab = { build: 'Aufbau', peak: 'Spitze', taper: 'Tapering', race: 'WK-Woche' };
  const pos = clamp(dayDiff(start, t) / Math.max(1, total - 1) * 100, 0, 100);
  let h = '<div class="band" aria-label="Trainingsphasen bis zum Rennen"><div class="band-track">';
  segs.forEach(sg => { h += '<div class="band-seg ' + sg.k + '" style="flex:' + sg.n + '" title="' + lab[sg.k] + ': ' + sg.n + ' Tage ab ' + fmtDS(sg.from) + '">' + (sg.n >= 4 ? lab[sg.k] + ' · ' + sg.n + ' T' : '') + '</div>'; });
  if (t >= start && t <= race) h += '<div class="band-done" style="width:' + pos + '%"></div><div class="band-marker" data-label="Heute" style="left:calc(' + pos + '% - 1px)"></div>';
  h += '</div><div class="band-dates"><span>Start ' + fmtDS(start) + '</span><span>Tapering ab ' + fmtDS(addDays(race, -11)) + '</span><span>Rennen ' + fmtDS(race) + '</span></div></div>';
  return h;
}

/* ---------- Diagramme (SVG, ohne Bibliothek) ---------- */
function niceStep(range, n){
  const raw = range / Math.max(1, n), p = Math.pow(10, Math.floor(Math.log10(raw || 1))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
function makeTicks(lo, hi, n, step){
  step = step || niceStep(hi - lo, n);
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, out = [];
  for (let v = a; v <= b + step * 1e-6; v += step) out.push(Math.round(v * 1000) / 1000);
  return out;
}
function tipBox(host, x, y, W, rect, title, rows){
  const tt = host.querySelector('.tt');
  tt.innerHTML = '';
  const d = document.createElement('div'); d.className = 'tt-d'; d.textContent = title; tt.appendChild(d);
  rows.forEach(r => {
    const row = document.createElement('div'); row.className = 'tt-r';
    const k = document.createElement('span'); k.className = 'key'; k.style.background = r.color; if (r.box) { k.style.height = '10px'; k.style.width = '10px'; k.style.borderRadius = '3px'; }
    const b = document.createElement('b'); b.textContent = r.value;
    const l = document.createElement('span'); l.textContent = r.name; l.style.color = 'var(--ink-2)';
    row.appendChild(k); row.appendChild(b); row.appendChild(l); tt.appendChild(row);
  });
  tt.hidden = false;
  const sx = rect.width / W, px = x * sx;
  const tw = tt.offsetWidth;
  let left = px + 14; if (left + tw > rect.width) left = px - tw - 14; if (left < 0) left = 4;
  tt.style.left = left + 'px'; tt.style.top = Math.max(0, y * sx - 10) + 'px';
}
function lineChart(host, cfg){
  const pts = cfg.series.reduce((a, s) => a + s.pts.length, 0);
  if (!pts) { host.innerHTML = '<div class="chart-empty">' + esc(cfg.empty || 'Noch keine Daten') + '</div>'; return; }
  const W = Math.max(300, host.clientWidth || 600), H = cfg.height || 220;
  const m = { l: cfg.ml || 42, r: 16, t: 14, b: 28 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const x0 = cfg.x0, span = Math.max(1, dayDiff(cfg.x0, cfg.x1));
  const X = d => m.l + dayDiff(x0, d) / span * iw;
  const vals = cfg.series.flatMap(s => s.pts.map(p => p.y)).concat((cfg.refs || []).map(r => r.y));
  let lo = cfg.yMin != null ? cfg.yMin : Math.min.apply(null, vals), hi = cfg.yMax != null ? cfg.yMax : Math.max.apply(null, vals);
  if (cfg.yMin == null || cfg.yMax == null) { const pd = (hi - lo) * 0.15 || cfg.padMin || 4; if (cfg.yMin == null) lo -= pd; if (cfg.yMax == null) hi += pd; }
  const ticks = makeTicks(lo, hi, 4, cfg.tickStep); lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
  const Y = v => cfg.invert ? m.t + (v - lo) / (hi - lo) * ih : m.t + ih - (v - lo) / (hi - lo) * ih;
  let g = '';
  (cfg.bands || []).forEach(b => {
    const y1 = Y(Math.min(hi, b.to)), y2 = Y(Math.max(lo, b.from));
    g += '<rect x="' + m.l + '" y="' + Math.min(y1, y2) + '" width="' + iw + '" height="' + Math.abs(y2 - y1) + '" style="fill:' + b.color + ';opacity:.09"/>';
    g += '<text x="' + (W - m.r - 4) + '" y="' + (Math.min(y1, y2) + 12) + '" text-anchor="end" class="ax">' + esc(b.label) + '</text>';
  });
  ticks.forEach(tv => {
    if (tv < lo - 1e-9 || tv > hi + 1e-9) return;
    g += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(tv) + '" y2="' + Y(tv) + '" style="stroke:var(--viz-grid);stroke-width:1"/>';
    g += '<text x="' + (m.l - 7) + '" y="' + (Y(tv) + 4) + '" text-anchor="end" class="ax">' + esc(cfg.yFmt ? cfg.yFmt(tv) : tv) + '</text>';
  });
  g += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + (m.t + ih) + '" y2="' + (m.t + ih) + '" style="stroke:var(--viz-axis);stroke-width:1"/>';
  const nx = W < 480 ? 3 : 5;
  for (let i = 0; i < nx; i++) {
    const d = addDays(x0, Math.round(span * i / (nx - 1)));
    g += '<text x="' + X(d) + '" y="' + (H - 8) + '" text-anchor="' + (i === 0 ? 'start' : i === nx - 1 ? 'end' : 'middle') + '" class="ax">' + fmtDM(d) + '</text>';
  }
  (cfg.refs || []).forEach(r => {
    g += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(r.y) + '" y2="' + Y(r.y) + '" style="stroke:var(--ink-2);stroke-width:1;opacity:.55"/>';
    g += '<text x="' + (m.l + 6) + '" y="' + (Y(r.y) - 5) + '" class="ax-strong">' + esc(r.label) + '</text>';
  });
  const maxGap = cfg.maxGap || 3;
  cfg.series.forEach(s => {
    const sp = s.pts.slice().sort((a, b) => a.x - b.x);
    let d = '', prev = null;
    sp.forEach(p => { const cmd = (!prev || dayDiff(prev.x, p.x) > maxGap) ? 'M' : 'L'; d += cmd + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1) + ' '; prev = p; });
    if (s.line !== false) g += '<path d="' + d + '" style="fill:none;stroke:' + s.color + ';stroke-width:' + (s.width || 2) + ';stroke-linecap:round;stroke-linejoin:round"/>';
    if (s.dots !== false) sp.forEach(p => { g += '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="4" style="fill:' + (s.dotColor ? s.dotColor(p) : s.color) + ';stroke:var(--viz-surface);stroke-width:2"/>'; });
  });
  g += '<line class="cx" x1="0" x2="0" y1="' + m.t + '" y2="' + (m.t + ih) + '" style="stroke:var(--ink-2);stroke-width:1;visibility:hidden"/>';
  g += '<rect class="hit" x="' + m.l + '" y="' + m.t + '" width="' + iw + '" height="' + ih + '" style="fill:transparent"/>';

function parseHills(str){
  const set = new Set();
  String(str || '').split(/[,;\s]+/).forEach(part => {
    const m = /^(\d{1,2})(?:-(\d{1,2}))?$/.exec(part.trim());
    if (m) { const a = +m[1], b = m[2] ? +m[2] : a; for (let k = Math.min(a, b); k <= Math.max(a, b) && k <= 21; k++) if (k >= 1) set.add(k); }
  });
  return set;
}
function computeSplits(T, hills){
  const segs = [];
  for (let k = 1; k <= 21; k++) segs.push({ k, d: 1 });
  segs.push({ k: 21.1, d: HM - 21, last: true });
  const off = sg => {
    if (sg.last) return -10;
    let o = 0; const k = sg.k;
    if (k === 1) o += 8; else if (k === 2) o += 4; else if (k === 3) o += 2;
    if (hills.has(k)) o += 4;
    if (k === 19 || k === 20) o -= 3;
    if (k === 21) o -= 5;
    return o;
  };
  const sumD = segs.reduce((a, s) => a + s.d, 0), sumO = segs.reduce((a, s) => a + off(s) * s.d, 0);
  const base = (T - sumO) / sumD;
  let cum = 0;
  return segs.map(sg => { const p = base + off(sg), t = p * sg.d; cum += t; return { k: sg.k, d: sg.d, pace: p, t, cum, hill: !sg.last && hills.has(sg.k), last: !!sg.last }; });
}

function keySession(){
  const P = CUR.PLAN;
  const k = Object.keys(P.byDate).sort().find(d => /^Letzter Temporeiz/.test(P.byDate[d].title));

}
function carboPlan(){

  return [
    { dtr: 4, gk: [4, 5], title: 'Kohlenhydratbetont essen', food: 'Normal essen, zu jeder Mahlzeit eine Portion Kohlenhydrate. Vollkorn (Nudeln, Reis, Haferflocken) ist hier noch gut.' },
    { dtr: 3, gk: [5, 6], title: 'Carbo-Loading startet', food: 'Portionen mit Pasta, Reis, Kartoffeln und Haferflocken vergrössern, Fett etwas reduzieren, Vollkorn langsam zurückfahren.' },
    { dtr: 2, gk: [7, 8], title: 'Speicher füllen', food: 'Ballaststoffarm: weisse Pasta, Weissreis, Kartoffeln ohne Schale, Weissbrot, Haferflocken in kleiner Menge. Wenig Fett, keine Hülsenfrüchte, kaum Rohkost.' },
    { dtr: 1, gk: [7, 8], title: 'Speicher füllen, Magen schonen', food: 'Wie am Vortag. Abendessen früh (18–19 Uhr), vertraut und ohne schwere Saucen. Regelmässig trinken.' },
    { dtr: 0, gk: [1, 2], title: 'Wettkampffrühstück', food: '3 Stunden vor dem Start: Haferflocken, wenn bewährt – oder Weissbrot/Zopf mit Honig oder Konfitüre und eine Banane. 400–500 ml trinken.' }
  ].map(r => Object.assign(r, { date: addDays(race, -r.dtr), g: [Math.round(wv * r.gk[0]), Math.round(wv * r.gk[1])], wv, est }));
}
function focusCard(iso){
  const s = S.settings, race = fromISO(s.raceDate), d = fromISO(iso), dtr = dayDiff(d, race), items = [];
  if (dtr < 0) return '';

  const ks = keySession();
  if (ks) { const kd = dayDiff(d, fromISO(ks.date)); if (kd >= 0 && kd <= 5) items.push(['Letzter Temporeiz', (kd === 0 ? 'Heute: ' : fmtDS(fromISO(ks.date)) + ': ') + ks.ses.title.replace('Letzter Temporeiz ', '') + ' im Renntempo – danach nur noch Frische.']); }

function warnSignals(){
  const days = lastNDays(30), rhr = days.map(i => S.days[i] && S.days[i].rhr).filter(isNum).sort((a, b) => a - b);
  const hrv = days.map(i => S.days[i] && S.days[i].hrv).filter(isNum).sort((a, b) => a - b);
  const med = a => a.length ? a[Math.floor(a.length / 2)] : null;
  const rhrN = med(rhr), hrvN = med(hrv);

    if ((isNum(e.recovery) && e.recovery < 34) || (up != null && up >= 8)) list.push({ iso: i, e, up });

}

function prepareImport(files){
  const results = [];
  let pending = files.length;
  if (!pending) return;
  Array.from(files).forEach(file => {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const rows = parseCSV(rd.result), sc = detectStrava(rows);
        if (sc) results.push({ name: file.name, type: 'strava', recs: [], an: analyzeStrava(rows, sc) });
        else {
          const det = detectWhoop(rows);
          const recs = det.type === 'unknown' ? [] : mapWhoop(rows, det);
          results.push({ name: file.name, type: det.type, recs: evaluateImport(det.type, recs) });
        }
      } catch (e) { results.push({ name: file.name, type: 'error', recs: [], err: String(e && e.message || e) }); }
      if (--pending === 0) { UI.imp = results; rerender(); }
    };
    rd.onerror = () => { results.push({ name: file.name, type: 'error', recs: [], err: 'Datei konnte nicht gelesen werden.' }); if (--pending === 0) { UI.imp = results; rerender(); } };
    rd.readAsText(file);
  });
}
function evaluateImport(type, recs){
  if (type === 'cycles' || type === 'sleeps') {
    const byDate = {};
    recs.forEach(r => { byDate[r.date] = r; }); /* letzter Eintrag pro Datum gewinnt */
    const seen = {};
    return recs.map(r => {
      const dup = byDate[r.date] !== r;
      if (dup) return Object.assign({}, r, { status: 'Doppelt in Datei', inc: false, cls: 'dup' });
      if (seen[r.date]) return null; seen[r.date] = 1;
      const ex = S.days[r.date];
      const fields = type === 'cycles' ? ['recovery', 'hrv', 'rhr', 'sleep', 'sleepEff', 'strain'] : ['sleep', 'sleepEff'];
      if (!ex) return Object.assign({}, r, { status: 'Neu', inc: true, cls: 'new' });
      const same = fields.every(f => r[f] == null || (isNum(ex[f]) && Math.abs(ex[f] - r[f]) < 0.01));
      if (same) return Object.assign({}, r, { status: 'Unverändert', inc: false, cls: 'dup' });
      return Object.assign({}, r, { status: 'Aktualisieren', inc: true, cls: 'upd' });
    }).filter(Boolean);
  }
  if (type === 'workouts') {
    const keys = {};
    return recs.map(r => {
      const key = r.date + ' ' + r.time + ' ' + r.activity;
      if (keys[key]) return Object.assign({}, r, { status: 'Doppelt in Datei', inc: false, cls: 'dup' });
      keys[key] = 1;
      if (S.workouts.some(w => w.whoopKey === key)) return Object.assign({}, r, { key, status: 'Bereits importiert', inc: false, cls: 'dup' });
      if (S.workouts.some(w => w.date === r.date && w.sport === r.sport && w.source !== 'whoop')) return Object.assign({}, r, { key, status: 'Mögliches Duplikat (manuell erfasst)', inc: false, cls: 'dup' });
      return Object.assign({}, r, { key, status: r.sport === 'run' ? 'Neu' : 'Neu (kein Lauf)', inc: r.sport === 'run' || !UI.onlyRuns, cls: 'new' });
    });
  }
  return recs;
}

function applyStrava(fi){
  const an = UI.imp[fi].an, o = an.opts, s = S.settings, msg = [];
  if (o.weekly && an.weeklyAvg > 0) { s.weeklyKm = Math.max(5, Math.round(an.weeklyAvg)); msg.push(s.weeklyKm + ' km pro Woche'); }
  if (o.longest && an.longest) { s.longestRun = Math.max(3, r05(an.longest.km)); msg.push('längster Lauf ' + fmtKm(s.longestRun) + ' km'); }
  if (o.days && an.days) { s.runDays = an.days.list.slice(); s.longDay = an.days.longDay; msg.push('Lauftage ' + an.days.list.map(d => WD[d]).join('/')); }
  if (o.hr && an.hr) { s.hrMax = an.hr.value; msg.push('HFmax ' + an.hr.value + ' bpm'); }
  const findRace = r => S.races.find(x => x.id === 'strava:' + r.runId) || S.races.find(x => x.date === r.date && Math.abs(x.dist - r.dist) < 0.5);
  const addRace = r => { const x = { id: 'strava:' + r.runId, date: r.date, name: r.name, dist: r.dist, gps: r.km, time: Math.round(r.time), elev: r.elev, avgHr: r.avgHr, maxHr: r.maxHr, source: 'strava' }; S.races.push(x); return x; };
  let nr = 0;
  an.races.forEach(r => { if (r.isRace && !findRace(r)) { addRace(r); nr++; } });
  if (nr) msg.push(nr + (nr === 1 ? ' Rennen' : ' Rennen') + ' gespeichert');
  if (o.ref >= 0 && an.races[o.ref]) {
    const r = an.races[o.ref], rr = findRace(r) || addRace(r);
    setRef(rr); msg.push('Referenz: ' + distLabel(rr.dist) + ' in ' + fmtDur(rr.time));
  }
  const rc = stravaRunCounts(an);
  rc.add.forEach(r => S.workouts.push({ id: uid(), date: r.date, sport: 'run', dist: r.km, dur: Math.round(r.race ? r.elapsed : r.moving), avgHr: r.avgHr,
    note: (r.race ? 'Rennen: ' : '') + (r.name || 'Lauf') + ' (Strava)', source: 'strava', stravaId: r.id, quality: r.race }));
  if (rc.add.length) msg.push(rc.add.length + ' Läufe im Tagebuch');
  if (o.weekly || o.longest || o.ref >= 0) s.profileSaved = true;
  UI.imp.splice(fi, 1); if (!UI.imp.length) UI.imp = null;
  UI.stravaDone = msg.length ? msg.join(' · ') : 'Nichts ausgewählt – keine Änderungen.';
  saveState(); recompute(); rerender();
  toast('Strava-Werte übernommen – Plan und Paces neu berechnet');
}
function afterImport(){

  if (!drop) return;
  inp.addEventListener('change', () => { if (inp.files.length) prepareImport(inp.files); });
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => { if (e.dataTransfer && e.dataTransfer.files.length) prepareImport(e.dataTransfer.files); });
}
function applyImport(){
  let nd = 0, nw = 0;
  UI.imp.forEach(f => {
    f.recs.filter(r => r.inc).forEach(r => {
      if (f.type === 'cycles' || f.type === 'sleeps') {
        const ex = S.days[r.date] || {};
        const manual = !!ex.source && ex.source !== 'whoop' && ex.source !== 'demo';
        const out = Object.assign({}, ex);
        (f.type === 'cycles' ? ['recovery', 'hrv', 'rhr', 'sleep', 'sleepEff', 'strain'] : ['sleep', 'sleepEff']).forEach(k => {
          if (r[k] == null) return;
          if (manual && !UI.overwriteManual && isNum(ex[k])) return;
          out[k] = r[k];
        });
        out.source = manual ? 'manuell + Whoop' : 'whoop';
        S.days[r.date] = out; nd++;
      } else if (f.type === 'workouts') {
        S.workouts.push({ id: uid(), date: r.date, sport: r.sport, activity: r.activity, dist: r.dist, dur: r.dur, avgHr: r.avgHr, note: r.activity + ' (Whoop)', source: 'whoop', whoopKey: r.key, quality: false });
        nw++;
      }
    });
  });
  UI.imp = null;
  saveState(); recompute();
  toast(nd + ' Tage und ' + nw + ' Einheiten importiert');
  rerender();
}

function saveRaceForm(f){

  const time = parseDur(fd.get('time'));
  if (!fromISO(date)) { toast('Bitte das Datum des Rennens angeben.'); return; }
  if (!isNum(dist) || dist < 1) { toast('Bitte eine gültige Distanz wählen.'); return; }
  if (!isNum(time) || time < dist * 150 || time > dist * 600) { toast('Die Zeit passt nicht zur Distanz (Format mm:ss oder h:mm:ss).'); return; }
  const r = { id: uid(), date, name, dist, time: Math.round(time), source: 'manuell' };
  S.races.push(r);

  if (first) setRef(r);
  S.settings.profileSaved = S.settings.profileSaved || first;
  saveState(); recompute(); rerender();
  toast(first ? 'Rennen hinzugefügt und als Referenz gesetzt' : 'Rennen hinzugefügt – als Referenz wählen, falls es Deine Form am besten zeigt');

function readSettingsForm(f){
  const fd = new FormData(f), s = Object.assign({}, S.settings), errs = [];
  const num = k => { const v = parseNum(fd.get(k)); return v; };
  s.name = String(fd.get('name') || '').trim().slice(0, 40);
  s.age = num('age'); s.sex = String(fd.get('sex') || ''); s.weight = num('weight'); s.hrMax = num('hrMax');
  const wk = num('weeklyKm'); if (!isNum(wk) || wk < 3) errs.push('Bitte die Laufkilometer pro Woche angeben.'); else s.weeklyKm = wk;
  const lr = num('longestRun'); if (!isNum(lr) || lr < 2) errs.push('Bitte den längsten Lauf der letzten 4 Wochen angeben.'); else s.longestRun = lr;
  s.refDist = parseFloat(fd.get('refDist')) || 10;
  const rt = String(fd.get('refTime') || '').trim();
  if (rt) { const sec = parseDur(rt); if (!isNum(sec) || sec < s.refDist * 150 || sec > s.refDist * 600) errs.push('Die Referenzzeit passt nicht zur Distanz (Format mm:ss oder h:mm:ss).'); else s.refTime = sec; }
  else s.refTime = null;
  if (s.refRaceId) { const rr = S.races.find(x => x.id === s.refRaceId); if (!rr || !isNum(s.refTime) || Math.abs(rr.time - s.refTime) > 1 || Math.abs(rr.dist - s.refDist) > 0.01) s.refRaceId = null; }
  const rd = fd.getAll('runDays').map(Number); if (rd.length < 2) errs.push('Bitte mindestens 2 Lauftage wählen (empfohlen: 3–5).'); else s.runDays = rd;
  s.longDay = +fd.get('longDay'); s.strengthPerWeek = +fd.get('strengthPerWeek');
  s.otherSports = String(fd.get('otherSports') || '').trim(); s.injuries = String(fd.get('injuries') || '').trim();
  s.load = ['vorsichtig', 'normal', 'ambitioniert'].includes(fd.get('load')) ? fd.get('load') : 'normal';
  s.cautious = s.load === 'vorsichtig';
  s.qPerWeek = ['auto', '1', '2'].includes(String(fd.get('qPerWeek'))) ? String(fd.get('qPerWeek')) : 'auto';
  s.recBase = num('recBase'); s.hrvBase = num('hrvBase'); s.rhrBase = num('rhrBase');
  s.raceName = String(fd.get('raceName') || '').trim() || DEF.raceName;
  const rdate = String(fd.get('raceDate') || ''); if (!fromISO(rdate)) errs.push('Bitte ein gültiges Renndatum wählen.'); else s.raceDate = rdate;
  const g = parseGoal(fd.get('goalTime')); if (!isNum(g) || g < 3600 || g > 4 * 3600) errs.push('Zielzeit bitte als h:mm:ss zwischen 1:00:00 und 4:00:00 eingeben.'); else s.goalTime = g;
  s.paceBasis = String(fd.get('paceBasis') || 'auto');
  const ps = String(fd.get('planStart') || ''); if (fromISO(ps)) s.planStart = ps;
  if (fromISO(s.planStart) > fromISO(s.raceDate)) errs.push('Der Planstart liegt nach dem Renndatum.');
  s.theme = String(fd.get('theme') || 'auto');
  return { s, errs };
}

function saveDayForm(f){
  const fd = new FormData(f);
  const date = String(fd.get('date') || '');
  if (!fromISO(date)) { toast('Bitte ein gültiges Datum wählen.'); return; }
  const num = k => parseNum(fd.get(k));
  const vals = {
    recovery: num('recovery'), hrv: num('hrv'), rhr: num('rhr'), sleep: parseHours(fd.get('sleep')), sleepEff: num('sleepEff'), strain: num('strain'), alc: fd.get('alc') === 'on',
    feel: fd.get('feel') ? +fd.get('feel') : null, pain: String(fd.get('pain') || 'none'), painNote: String(fd.get('painNote') || '').trim()
  };
  if (isNum(vals.recovery)) vals.recovery = clamp(vals.recovery, 0, 100);
  const anyDay = ['recovery', 'hrv', 'rhr', 'sleep', 'sleepEff', 'strain', 'feel'].some(k => isNum(vals[k])) || vals.pain !== 'none' || vals.painNote || vals.alc;
  const ex = S.days[date];
  if (anyDay) {
    const src = ex && ex.source && ex.source !== 'manuell' ? (ex.source.includes('manuell') ? ex.source : ex.source === 'demo' ? 'manuell' : 'manuell + Whoop') : 'manuell';
    S.days[date] = Object.assign({}, ex || {}, vals, { source: src });
  } else if (ex) delete S.days[date];
  const dist = num('dist'), dur = parseDur(fd.get('dur')), wid = String(fd.get('wid') || '');
  let savedWo = null;
  if (isNum(dist) || isNum(dur)) {
    const wo = { date, sport: String(fd.get('sport') || 'run'), dist: isNum(dist) ? dist : null, dur: isNum(dur) ? dur : null, avgHr: num('avgHr'),
                 mainPace: parsePace(fd.get('mainPace')), note: String(fd.get('note') || '').trim(), quality: fd.get('quality') === 'on' };
    if (wid) { const i = S.workouts.findIndex(x => x.id === wid); if (i >= 0) { S.workouts[i] = Object.assign({}, S.workouts[i], wo); savedWo = S.workouts[i]; } }
    else { savedWo = Object.assign({ id: uid(), source: 'manuell' }, wo); S.workouts.push(savedWo); }
  }
  UI.editWorkout = null; UI.logDate = date;
  saveState(); recompute();
  toast('Gespeichert' + (savedWo ? ' – Einheit erfasst' : ''));
  rerender();
  const ses = CUR.PLAN.byDate[date];
  if (savedWo && savedWo.sport === 'run' && ses && ses.type === 'test' && isNum(savedWo.dist) && isNum(savedWo.dur) && savedWo.dist >= 4.8 && savedWo.dist <= 5.3) {
    const t5 = savedWo.dur / savedWo.dist * 5;
    confirmBox('Testzeit übernehmen?', 'Dein 5-km-Test: ' + fmtDur(t5) + '. Soll das Cockpit diese Zeit als Referenz nehmen und Zielzeit-Einschätzung und Paces neu berechnen?', 'Übernehmen', false).then(ok => {
      if (!ok) return;
      S.settings.refDist = 5; S.settings.refTime = Math.round(t5); saveState(); recompute(); rerender(); toast('Referenzzeit übernommen – Paces neu berechnet');
    });
  }
}

const LOGO_URI = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(LOGO_SVG);
function logoPng(size){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, size, size);
      c.toBlob(b => b ? res(b) : rej(new Error('PNG')), 'image/png');
    };
    img.onerror = () => rej(new Error('Logo'));
    img.src = LOGO_URI;
  });
}
/* ICO mit eingebetteten PNGs (Windows Vista und neuer) */
async function logoIco(){
  const sizes = [16, 24, 32, 48, 64, 128, 256];
  const bufs = await Promise.all(sizes.map(n => logoPng(n).then(b => b.arrayBuffer())));
  const head = 6 + 16 * sizes.length, out = new Uint8Array(head + bufs.reduce((a, b) => a + b.byteLength, 0)), dv = new DataView(out.buffer);
  dv.setUint16(2, 1, true); dv.setUint16(4, sizes.length, true);
  let off = head;
  sizes.forEach((n, i) => {
    const e = 6 + 16 * i;
    dv.setUint8(e, n >= 256 ? 0 : n); dv.setUint8(e + 1, n >= 256 ? 0 : n); dv.setUint16(e + 4, 1, true); dv.setUint16(e + 6, 32, true);
    dv.setUint32(e + 8, bufs[i].byteLength, true); dv.setUint32(e + 12, off, true);
    out.set(new Uint8Array(bufs[i]), off); off += bufs[i].byteLength;
  });
  return new Blob([out], { type: 'image/x-icon' });
}
function downloadBlob(name, blob){
  try {
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 800);
    return true;
  } catch (e) { return false; }
}
function download(name, text){
  try {
    const blob = new Blob([text], { type: 'application/json' }), url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 800);
    return true;
  } catch (e) { return false; }
}
function importBackup(text){
  let obj;
  try { obj = JSON.parse(text); } catch (e) { toast('Das ist kein gültiges JSON-Backup.'); return; }
  if (!obj || typeof obj !== 'object' || !obj.settings) { toast('Im Backup fehlen die Einstellungen – falsche Datei?'); return; }
  confirmBox('Backup einlesen?', 'Alle aktuellen Daten in diesem Browser werden durch das Backup ersetzt.', 'Ersetzen', true).then(ok => {
    if (!ok) return;
    S = normalizeState(obj); saveState(); applyTheme(); recompute(); UI.showBackup = false; go('heute'); toast('Backup eingelesen');
  });
}
const ACT = {

  cycleTheme: () => { const order = ['auto', 'light', 'dark']; S.settings.theme = order[(order.indexOf(S.settings.theme) + 1) % 3]; saveState(); applyTheme(); if (VIEW === 'einstellungen') rerender(); },

  undone: el => { const d = el.dataset.date; if (runWorkouts(d).length) S.checks[d] = 'open'; else delete S.checks[d]; saveState(); rerender(); },
  skip: el => { S.checks[el.dataset.date] = 'skipped'; saveState(); rerender(); toast('Übersprungen – nicht nachholen, einfach weiter nach Plan'); },
  toggleCheck: (el, e) => {
    e.preventDefault(); e.stopPropagation();
    const d = el.dataset.date, st = statusOf(d);
    if (st === 'done') { if (runWorkouts(d).length) S.checks[d] = 'open'; else delete S.checks[d]; }
    else S.checks[d] = 'done';
    saveState(); rerender();
  },
  swap: el => {
    const d = el.dataset.date, t1 = isoOf(addDays(fromISO(d), 1));
    S.swaps[d] = t1; S.swaps[t1] = d; saveState(); rerender(); toast('Einheit auf morgen verschoben – heute locker');
  },
  unswap: el => { const d = el.dataset.date, o = S.swaps[d]; delete S.swaps[d]; if (o) delete S.swaps[o]; saveState(); rerender(); },
  log: el => { UI.logDate = el.dataset.date; UI.editWorkout = null; go('tagebuch'); setTimeout(() => { const i = $('#f-dist'); if (i) { i.scrollIntoView({ block: 'center' }); i.focus(); } }, 30); },
  logvals: el => { UI.logDate = el.dataset.date; UI.editWorkout = null; go('tagebuch'); setTimeout(() => { const i = $('#f-rec'); if (i) i.focus(); }, 30); },
  goToday: () => { UI.logDate = todayISO(); UI.editWorkout = null; rerender(); },
  editDay: el => { UI.logDate = el.dataset.date; UI.editWorkout = null; render(); window.scrollTo(0, 0); },
  editWo: el => { const w = S.workouts.find(x => x.id === el.dataset.id); if (!w) return; UI.logDate = w.date; UI.editWorkout = w.id; render(); window.scrollTo(0, 0); },
  cancelEditWo: () => { UI.editWorkout = null; rerender(); },
  delWo: el => confirmBox('Einheit löschen?', 'Die Einheit wird endgültig aus dem Tagebuch entfernt.', 'Löschen', true).then(ok => { if (!ok) return; S.workouts = S.workouts.filter(x => x.id !== el.dataset.id); if (UI.editWorkout === el.dataset.id) UI.editWorkout = null; saveState(); recompute(); rerender(); toast('Einheit gelöscht'); }),
  delDay: el => confirmBox('Tageswerte löschen?', 'Recovery, HRV, Ruhepuls, Schlaf, Strain und Befinden vom ' + fmtDS(fromISO(el.dataset.date)) + ' werden entfernt. Einheiten bleiben erhalten.', 'Löschen', true).then(ok => { if (!ok) return; delete S.days[el.dataset.date]; saveState(); rerender(); toast('Tageswerte gelöscht'); }),
  moreLog: () => { UI.logLimit += 60; rerender(); },
  scrollToday: () => { const el = document.querySelector('.week.current') || document.querySelector('.week'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  demoOn: () => { const d = makeDemo(); Object.keys(d.days).forEach(k => { if (!S.days[k]) S.days[k] = d.days[k]; }); S.workouts = S.workouts.concat(d.wos.filter(w => !S.workouts.some(x => x.date === w.date))); saveState(); recompute(); rerender(); toast('Demo-Daten geladen'); },
  demoOff: () => { Object.keys(S.days).forEach(k => { if (S.days[k].source === 'demo') delete S.days[k]; }); S.workouts = S.workouts.filter(w => w.source !== 'demo'); saveState(); recompute(); rerender(); toast('Demo-Daten entfernt'); },
  resetCheck: el => { const id = el.dataset.list; Object.keys(S.raceCheck).forEach(k => { if (k.startsWith(id + ':')) delete S.raceCheck[k]; }); saveState(); rerender(); },
  impAll: el => { const f = UI.imp[+el.dataset.f], on = el.dataset.v === '1'; f.recs.forEach(r => { r.inc = on && (r.cls === 'new' || r.cls === 'upd') && (f.type !== 'workouts' || r.sport === 'run' || !UI.onlyRuns); }); rerender(); },
  impGo: () => applyImport(),
  stravaApply: el => applyStrava(+el.dataset.f),
  stravaDrop: el => { UI.imp.splice(+el.dataset.f, 1); if (!UI.imp.length) UI.imp = null; rerender(); },
  goRaces: () => { go('einstellungen'); setTimeout(() => { const c = $('#racesCard'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 30); },
  delRace: el => confirmBox('Rennen löschen?', 'Das Rennresultat wird aus der Liste entfernt.', 'Löschen', true).then(ok => {
    if (!ok) return;
    S.races = S.races.filter(r => r.id !== el.dataset.id);
    if (S.settings.refRaceId === el.dataset.id) S.settings.refRaceId = null;
    saveState(); recompute(); rerender(); toast('Rennen gelöscht');
  }),
  impCancel: () => { UI.imp = null; rerender(); },
  restartPlan: () => confirmBox('Plan ab heute neu starten?', 'Der Plan wird ab ' + fmtDL(today()) + ' neu aufgebaut. Tagebuch und Abhak-Status bleiben erhalten, Verschiebungen werden zurückgesetzt.', 'Neu starten', false).then(ok => {
    if (!ok) return; S.settings.planStart = todayISO(); S.swaps = {}; saveState(); recompute(); rerender(); toast('Plan ab heute neu aufgebaut');
  }),
  iconPng: () => logoPng(512).then(b => { downloadBlob('hm-cockpit-logo.png', b); toast('Logo als PNG gespeichert'); }).catch(() => toast('Logo konnte nicht erzeugt werden')),
  iconIco: () => logoIco().then(b => { downloadBlob('hm-cockpit.ico', b); toast('Symbol als ICO gespeichert'); }).catch(() => toast('Symbol konnte nicht erzeugt werden')),
  exportDl: () => { const ok = download('hm-cockpit-backup-' + todayISO() + '.json', JSON.stringify(S, null, 1)); if (!ok) { UI.showBackup = true; rerender(); } toast(ok ? 'Backup-Datei erstellt' : 'Download nicht möglich – Backup unten als Text kopieren'); },
  exportCopy: () => {
    const txt = JSON.stringify(S);
    try { navigator.clipboard.writeText(txt).then(() => toast('Backup in die Zwischenablage kopiert'), () => { UI.showBackup = true; rerender(); toast('Kopieren nicht erlaubt – Text unten markieren und kopieren'); }); }
    catch (e) { UI.showBackup = true; rerender(); }
  },
  exportShow: () => { UI.showBackup = !UI.showBackup; rerender(); if (UI.showBackup) setTimeout(() => { const t = $('#bkOut'); if (t) t.select(); }, 20); },
  importText: () => { const t = $('#bkIn'); if (t && t.value.trim()) importBackup(t.value.trim()); else toast('Bitte zuerst den Backup-Text einfügen.'); },
  resetAll: () => confirmBox('Alle Daten löschen?', 'Einstellungen, Tagebuch, Whoop-Daten und Abhak-Status werden in diesem Browser gelöscht. Das lässt sich nicht rückgängig machen – vorher ein Backup herunterladen.', 'Alles löschen', true).then(ok => {

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'f-date' && fromISO(t.value)) { UI.logDate = t.value; UI.editWorkout = null; rerender(); return; }
  if (t.name === 'raceT') { UI.raceT = t.value; rerender(); return; }
  if (t.id === 'f-hills') { S.settings.hillKm = t.value.trim(); saveState(); rerender(); return; }
  if (t.dataset && t.dataset.check) { if (t.checked) S.raceCheck[t.dataset.check] = 1; else delete S.raceCheck[t.dataset.check]; saveState(); rerender(); return; }
  if (t.dataset && t.dataset.imp) { const [fi, ri] = t.dataset.imp.split(':').map(Number); UI.imp[fi].recs[ri].inc = t.checked; rerender(); return; }
  if (t.id === 'optRuns') { UI.onlyRuns = t.checked; if (UI.imp) UI.imp.forEach(f => { if (f.type === 'workouts') f.recs.forEach(r => { if (r.cls === 'new' && r.sport !== 'run') r.inc = !UI.onlyRuns; }); }); rerender(); return; }
  if (t.id === 'optOverwrite') { UI.overwriteManual = t.checked; return; }
  if (t.dataset && t.dataset.sopt) { const [fi, k] = t.dataset.sopt.split(':'); UI.imp[+fi].an.opts[k] = t.checked; return; }
  if (t.dataset && t.dataset.srace) {
    const [fi, ri] = t.dataset.srace.split(':').map(Number), an = UI.imp[fi].an;
    an.races[ri].isRace = t.checked;
    if (!t.checked && an.opts.ref === ri) an.opts.ref = stravaRec(an);
    if (t.checked && an.opts.ref < 0) an.opts.ref = stravaRec(an);
    rerender(); return;
  }
  if (t.dataset && t.dataset.sref) { UI.imp[+t.dataset.sref].an.opts.ref = +t.value; rerender(); return; }
  if (t.dataset && t.dataset.srange) { UI.imp[+t.dataset.srange].an.opts.range = +t.value; rerender(); return; }
  if (t.name === 'refRace') {
    const r = S.races.find(x => x.id === t.value);
    if (r) { setRef(r); saveState(); recompute(); rerender(); toast('Referenz gesetzt – Einschätzung und Paces neu berechnet'); }
    return;
  }
  if (t.id === 'bkFile' && t.files && t.files[0]) { const rd = new FileReader(); rd.onload = () => importBackup(String(rd.result)); rd.readAsText(t.files[0]); t.value = ''; return; }
  if (t.name === 'theme' && VIEW === 'einstellungen') { S.settings.theme = t.value; saveState(); applyTheme(); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'dayForm') saveDayForm(f);
  else if (f.id === 'raceForm') saveRaceForm(f);
  else if (f.id === 'settingsForm') {
    const { s, errs } = readSettingsForm(f);
    if (errs.length) { toast(errs[0]); return; }
    const raceChanged = s.raceDate !== S.settings.raceDate;
    s.profileSaved = true;
    S.settings = s;
    if (raceChanged) S.swaps = {};
    saveState(); applyTheme(); recompute(); rerender();
    toast('Gespeichert – Plan und Paces aktualisiert');
  }
});
window.addEventListener('hashchange', () => { const hsh = (location.hash || '').slice(1); if (VIEWS.includes(hsh) && hsh !== VIEW) go(hsh); });
let resizeT = null;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (VIEW === 'verlauf') drawVerlauf(); }, 150); });

const RENDER = { heute: viewHeute, tagebuch: viewTagebuch, plan: viewPlan, verlauf: viewVerlauf, wettkampf: viewWettkampf, leitfaden: viewLeitfaden, import: viewImport, einstellungen: viewEinstellungen };
const AFTER = { verlauf: drawVerlauf, import: afterImport };

if (!storageOK) toast('Browser-Speicher nicht verfügbar – Daten gehen beim Schliessen verloren. Backup nutzen.');

try { const hsh = (location.hash || '').slice(1); if (VIEWS.includes(hsh)) startView = hsh; } catch (e) { /* ignorieren */ }
go(startView, true);
/* Tageswechsel bei offen gelassenem Tab */

setInterval(() => { if (todayISO() !== lastDay) { lastDay = todayISO(); recompute(); rerender(); } }, 60000);
