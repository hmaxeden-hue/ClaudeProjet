[project]
name = "ai-business-radar"
version = "0.1.0"
description = "Lokale Pipeline, die täglich AI-/Business-YouTube-Videos findet, auf Substanz prüft und einen dichten Tagesbericht schreibt."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "google-api-python-client>=2.140.0",
    "yt-dlp>=2024.8.6",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
